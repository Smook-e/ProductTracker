services:
  fastapi:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .example.env
    depends_on:
      - postgres
      - redis
    

  postgres:
    image: postgres:16
    env_file:
      - .example.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

  celery:
    build: .
    command: celery -A celery_app worker --loglevel=info
    env_file:
      - .example.env
    depends_on:
      - postgres
      - redis
  celery-beat:
    build: .
    command: celery -A celery_app beat --loglevel=info
    env_file:
      - .example.env
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: